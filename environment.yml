
name: rnaseq

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:

# ======================
# Core
# ======================
- python=3.12
- pip

# ======================
# R
# ======================
- r-base=4.5
- r-essentials

# ======================
# Bioconductor
# ======================
- bioconductor-deseq2
- bioconductor-tximport
- bioconductor-tximeta
- bioconductor-rtracklayer
- bioconductor-genomicfeatures
- bioconductor-genomicranges
- bioconductor-genomicalignments
- bioconductor-rsamtools
- bioconductor-biostrings
- bioconductor-iranges
- bioconductor-s4vectors
- bioconductor-genomeinfodb
- bioconductor-annotationdbi
- bioconductor-org.mm.eg.db
- bioconductor-clusterprofiler
- bioconductor-enhancedvolcano

# ======================
# CRAN
# ======================
- r-tidyverse
- r-readr
- r-dplyr
- r-data.table
- r-ggplot2
- r-pheatmap
- r-rcolorbrewer
- r-optparse
- r-stringr
- r-devtools
- r-remotes

# ======================
# RNA-seq
# ======================
- salmon
- fastqc
- multiqc
- fastp
- subread
- samtools
- bedtools

# STAR (optionnel)
- star

# Workflow
- snakemake

# Compression
- pigz

# ======================
# Python
# ======================
- pandas
- numpy
- scipy
- matplotlib
- seaborn
- jupyterlab
- notebook

# ======================
# Git
# ======================
- git
- gh

# ======================
# Utilities
# ======================
- wget
- curl
- unzip
- tree

# ======================
# Pip
# ======================
- pip:
    - gseapy

